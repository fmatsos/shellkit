# A tag vX.Y.Z = a release: the checks on Linux and macOS first, then a GitHub
# release with notes generated from the commits since the previous tag, then the
# `release` branch moved to it. `shkit update` (and the daily auto-update) follow
# that branch only: a tag whose checks fail, or a pre-release (v2.0.0-rc.1), never
# reaches a clone. Fast-forward only: an older tag than the release is refused.
#   git tag -a v1.2.0 -m v1.2.0 && git push origin v1.2.0
name: release
on:
  push:
    tags: ['v[0-9]*']
jobs:
  check:
    uses: ./.github/workflows/check.yml
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the push below needs the history
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version tag: $TAG" >&2; exit 1; }
          pre=; [[ $TAG == *-* ]] && pre=--prerelease   # v2.0.0-rc1: shkit update skips it
          gh release create "$TAG" --verify-tag --generate-notes --title "shellkit $TAG" $pre
          [[ -n $pre ]] || git push origin "$(git rev-parse "$TAG^{commit}"):refs/heads/release"   # clones update to it
